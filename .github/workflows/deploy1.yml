name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify website files
        run: |
          test -f "new/index (14).html" || {
            echo "ERROR: Main portfolio HTML file not found."
            exit 1
          }

          test -f "new/explore.html" || {
            echo "ERROR: Explore HTML file not found."
            exit 1
          }

          test -d "new/assets" || {
            echo "ERROR: Assets directory not found."
            exit 1
          }

      - name: Prepare website
        run: |
          mkdir -p site/assets

          cp -r new/assets/. site/assets/

          cp "new/index (14).html" site/index.html

          cp "new/explore.html" site/explore.html

          echo "Website prepared successfully."
          find site -maxdepth 2 -type f

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
